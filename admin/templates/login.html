<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Login – Admin Kosmetik</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Toko Kosmetik Admin",
        "description": "Sistem manajemen penjualan produk kosmetik berbasis data"
      }
    </script>
    <style>
      body {
        background: linear-gradient(135deg, #f5a7c7 0%, #c084e8 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        border: none;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      }
      .btn-login {
        background: linear-gradient(135deg, #e879a0, #a855f7);
        border: none;
        border-radius: 8px;
        font-weight: 600;
      }
      .btn-login:hover {
        opacity: 0.9;
      }
      .logo {
        font-size: 2.5rem;
      }
    </style>
  </head>
  <body>
    <div class="card p-5" style="width: 380px">
      <div class="text-center mb-4">
        <div
          class="navbar-brand fw-bold d-flex justify-content-center align-items-center gap-2"
        >
          <img
            src="/static/img/download.png"
            alt="Logo"
            width="35"
            height="35"
          />
        </div>
        <h4 class="fw-bold mt-2" style="color: #a855f7">Admin Kosmetik</h4>
        <small class="text-muted">Sistem Manajemen Penjualan</small>
      </div>
      {% if error %}
      <div class="alert alert-danger py-2 text-center small">{{ error }}</div>
      {% endif %}
      <form method="POST">
        <div class="mb-3">
          <label class="form-label small fw-semibold text-muted"
            >Username</label
          >
          <input
            name="username"
            class="form-control"
            placeholder="admin"
            required
          />
        </div>
        <div class="mb-4">
          <label class="form-label small fw-semibold text-muted"
            >Password</label
          >
          <input
            name="password"
            type="password"
            class="form-control"
            placeholder="••••••••"
            required
          />
        </div>
        <button class="btn btn-login text-white w-100 py-2">Masuk →</button>
      </form>
      <p class="text-center text-muted small mt-3 mb-0">
        Username: <code>admin</code> &nbsp;|&nbsp; Password:
        <code>admin123</code>
      </p>
    </div>
  </body>
</html>
