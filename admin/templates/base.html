<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Admin Kosmetik{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Store","name":"Toko Kosmetik","description":"Penjualan produk kosmetik skincare Indonesia","category":"Kosmetik & Kecantikan"}
  </script>
  <style>
    :root{--pink:#e879a0;--purple:#a855f7;--soft:#fdf4ff;}
    body{background:#f8f9fa;font-family:'Segoe UI',sans-serif;}
    .sidebar{width:220px;min-height:100vh;background:linear-gradient(180deg,#7c3aed,#be185d);position:fixed;top:0;left:0;padding-top:1rem;}
    .sidebar .brand{color:#fff;font-size:1.1rem;font-weight:700;padding:1rem 1.25rem 1.5rem;border-bottom:1px solid rgba(255,255,255,.15);}
    .sidebar a{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.8);text-decoration:none;padding:.65rem 1.25rem;border-radius:8px;margin:.15rem .5rem;font-size:.9rem;transition:.2s;}
    .sidebar a:hover,.sidebar a.active{background:rgba(255,255,255,.2);color:#fff;}
    .sidebar a span{font-size:1.1rem;}
    .main-content{margin-left:220px;padding:1.5rem 2rem;}
    .topbar{background:#fff;border-radius:12px;padding:.75rem 1.5rem;display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;box-shadow:0 1px 4px rgba(0,0,0,.06);}
    .card-stat{background:#fff;border-radius:12px;padding:1.25rem 1.5rem;border:none;box-shadow:0 1px 4px rgba(0,0,0,.06);}
    .badge-tipe{font-size:.75rem;padding:.3rem .65rem;border-radius:20px;}
    .badge-serum{background:#ede9fe;color:#7c3aed;}
    .badge-toner{background:#fce7f3;color:#be185d;}
    .badge-facial.wash{background:#e0f2fe;color:#0369a1;}
    .table th{font-size:.8rem;color:#6b7280;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
    .btn-pink{background:var(--pink);color:#fff;border:none;}
    .btn-pink:hover{background:#db2777;color:#fff;}
    .btn-purple{background:var(--purple);color:#fff;border:none;}
    .btn-purple:hover{background:#9333ea;color:#fff;}
  </style>
</head>
<body>
<div class="sidebar">
  <div class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
        <img src="/static/img/download.png" alt="Logo" width="35" height="35">
      Kosmetik Admin
  </div>
  <nav class="mt-2">
    <a href="/dashboard" class="{% if request.path=='/dashboard' %}active{% endif %}"><span>📊</span> Dashboard</a>
    <a href="/produk"    class="{% if '/produk' in request.path %}active{% endif %}"><span>🧴</span> Produk</a>
    <a href="/laporan"   class="{% if request.path=='/laporan' %}active{% endif %}"><span>📋</span> Laporan</a>
    <a href="/pesanan" class="{% if request.path=="/pesanan" %}active{% endif %}"><span>📦</span> Pesanan</a>
    <a href="/ml" class="{% if '/ml' in request.path %}active{% endif %}"><span>🤖</span> Machine Learning</a>
    <a href="/database" class="{% if '/database' in request.path %}active{% endif %}"><span>🗄️</span> Database</a>
    <a href="/logout" class="mt-2" style="color:rgba(255,255,255,.5)"><span>🚪</span> Keluar</a>
  </nav>
</div>
<div class="main-content">
  <div class="topbar">
    <div>
      <span class="fw-semibold">{% block page_title %}Dashboard{% endblock %}</span>
    </div>
    <div class="d-flex align-items-center gap-2">
      <span class="badge" style="background:#ede9fe;color:#7c3aed">Admin</span>
      <span class="text-muted small">Selamat datang 👋</span>
    </div>
  </div>
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
