<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Toko Kosmetik{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Store","name":"Toko Kosmetik","description":"Katalog produk kosmetik skincare Indonesia"}
  </script>
  <style>
    body { background: #fdf4ff; font-family: 'Segoe UI', sans-serif; }
    .navbar { background: #fff; box-shadow: 0 1px 8px rgba(0,0,0,.07); }
    .navbar-brand { font-weight: 700; color: #a855f7 !important; font-size: 1.2rem; }
    .nav-link { color: #374151 !important; font-size: .9rem; }
    .nav-link:hover, .nav-link.active { color: #a855f7 !important; }
    .btn-pink { background: linear-gradient(135deg,#e879a0,#a855f7); color: #fff; border: none; border-radius: 8px; }
    .btn-pink:hover { opacity: .9; color: #fff; }
    footer { background: #1f1535; color: rgba(255,255,255,.6); padding: 2rem 0; margin-top: 4rem; font-size: .85rem; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg px-4 py-2">
  <a class="navbar-brand" href="/katalog">💄 Toko Kosmetik</a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navMenu">
    <ul class="navbar-nav me-auto ms-3 gap-1">
      <li class="nav-item"><a class="nav-link {% if request.path=='/katalog' %}active fw-semibold{% endif %}" href="/katalog">🛍️ Katalog</a></li>
      <li class="nav-item"><a class="nav-link {% if request.path=='/cek-pesanan' %}active fw-semibold{% endif %}" href="/cek-pesanan">🔍 Cek Pesanan</a></li>
      <li class="nav-item"><a class="nav-link" href="/api/produk" target="_blank">🌐 API Data</a></li>
    </ul>
    <div class="d-flex align-items-center gap-2">
      <span class="badge" style="background:#ede9fe;color:#7c3aed;font-size:.75rem">Port 5002 — Halaman User</span>
    </div>
  </div>
</nav>

{% block content %}{% endblock %}

<footer>
  <div class="container text-center">
    <div class="mb-2">💄 <strong style="color:#fff">Toko Kosmetik</strong></div>
    <div>Produk skincare terpercaya • Data semantik via <a href="/api/produk" style="color:#c084e8">Schema.org JSON-LD</a></div>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
